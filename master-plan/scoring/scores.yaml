# Compiled15 master plan: scoring data.
# Every number in RESULTS.md and FINAL_DECISION.md is computed from this file
# by score.py. Change a score here, re-run, and the ranking updates.
#
# Scale: 1-10 per criterion. Anchors for 2 / 5 / 8 / 10 are in ../00_SCORING_FRAMEWORK.md.
# p_success: probability the end-to-end demo works live by code freeze.
# Scores are analyst judgments made before customer evidence. Phase 1 of the
# master plan replaces them with evidence-based scores (see README.md).

criteria:
  R: {name: RFS fit, weight: 12}
  J: {name: Judge appeal, weight: 12}
  F: {name: 8-hour feasibility, weight: 15}
  D: {name: Demo impact and verifiability, weight: 12}
  T: {name: Technical depth and defensibility, weight: 8}
  N: {name: Novelty and wedge, weight: 8}
  M: {name: Market size and urgency, weight: 8}
  C: {name: Validation possible at the event, weight: 8}
  S: {name: Sponsor stacking, weight: 7}
  P: {name: Post-event startup potential, weight: 10}

# Gates are pass/fail. A candidate that fails any gate is excluded from the ranking.
gates:
  G1: Ends in a verifiable artifact (PR, alert, signed token, report with citations)
  G2: No regulated claim needed to demo (not a medical device, not legal advice, not KYC-certified)
  G3: All data needed for the demo can be created or obtained before code freeze
  G4: A named buyer who already spends money on the problem

tracks:
  "1": Multiplayer AI
  "2": AI-powered consumer products for 1B people
  "3": AI for the aging population
  "4": AI-native compliance infrastructure
  "5": Self-maintaining APIs
  "6": Proving you're human

