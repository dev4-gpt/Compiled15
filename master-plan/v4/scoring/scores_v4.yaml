    evidence:
      W: "AGI SDK has a waiting-for-input status, live VNC view and persistent sessions (agi-inc/agi-node, sponsor_wow_yc_fit.md)"
      M: "FBI IC3 2025: ~$7.7B lost by people 60+ (via AARP); 63M US family caregivers (AARP 2025)"
      P: "Spans 3 YC Fall 2026 RFS (Aging, Proving You're Human, Multiplayer); no 2026 YC company found doing caregiver co-sign (sponsor_wow_yc_fit.md)"
      S: "Built on AGI Inc's API (judge Vivek Patel, $500 best-use prize)"
      N: "Auth0 async approval, World AgentKit and Visa/Mastercard agent programs lack family/caregiver co-approval (sponsor_wow_yc_fit.md)"

  - id: leadagent
    name: LeadAgent (founder lead and investor research)
    track: T2
    pitch: "Founder types an ICP or round; agent returns 50 researched leads or investors with sources and draft emails in minutes. $29 per run."
    p_success: 0.55
    gates: [G1, G2, G3, G4]
