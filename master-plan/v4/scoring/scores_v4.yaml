# Compiled15 v4 scoring. Run: python3 master-plan/scoring/score.py --config master-plan/v4/scoring/scores_v4.yaml
# Changes from v3, at the user's request:
# - adds W (AI-native wow: the agent acts live) and P (startup growth potential);
# - U counts buyers reachable WITHOUT depending on local organizations attending;
# - drops Q (consulting-grade) and T (fit with selling) as separate criteria.
# The honesty rules are unchanged:
# - a score of 8 or more needs an evidence entry, or the script caps it at 7;
# - the qualification bar is weighted >= 8.0 and p_success >= 0.6.
# Evidence: research_notes/v4 new ideas/*.md, research_notes/v3 judges sponsors demand/*.md
# (all from search extracts; verify on site).

formula: {a: 0.4, b: 0.6}
evidence_rule: {min_score: 8, cap: 7}
qualify: {weighted_min: 8.0, p_min: 0.6}

criteria:
  E: {name: Event track metric fit, weight: 16}
  V: {name: Verifiable real-world proof, weight: 14}
  F: {name: Feasibility in the remaining ~6 hours, weight: 14}
  W: {name: AI-native wow (agent acts live), weight: 12}
  M: {name: Public demand evidence, weight: 10}
  P: {name: Startup growth potential after the event, weight: 10}
  U: {name: Buyers or users reachable without local orgs, weight: 8}
  S: {name: Sponsor and judge alignment, weight: 8}
  N: {name: Novelty vs named incumbents, weight: 8}

gates:
  G1: Proof uses inputs the team did not author (real users, real payments, real public benchmarks or code)
  G2: Consent-safe and no regulated claim
  G3: Free stack on laptops, no same-day third-party approval
  G4: Lands in a confirmed track or sponsor prize

tracks:
  T1: "Track 1: self-improving agents on Luminal (held-out improvement)"
  T2: "Track 2: sales during the event"
  SP: "Sponsor prizes only"

candidates:
  # ---------- User-proposed ideas ----------
  - id: dispatchiq
    name: DispatchIQ (as Track 1 agent evolution)
    track: T1
    pitch: "Luminal agents evolve field-service dispatch code; a deterministic rule checker scores every schedule; tested on unseen disrupted days (sick tech, 2 PM emergency)."
    p_success: 0.65
    gates: [G1, G2, G3, G4]
    scores: {E: 9, V: 8, F: 8, W: 8, M: 7, P: 6, U: 3, S: 8, N: 5}
    evidence:
      E: "Track 1: baseline, rounds, fresh held-out tests, judged on relative improvement and difficulty (luma.com/compiled-jjvw)"
      V: "Public benchmark instances (Solomon VRPTW) plus freshly generated held-out days; deterministic feasibility checker (Compiled15_1A_Project_Strategy.docx; research_notes/v4 new ideas/track1_problems.md)"
      F: "Hour-by-hour plan already exists (ScheduleEvolve in Compiled15_1A_Project_Strategy.docx); CPU-only simulation"
      W: "Live Gantt before/after re-plan plus a live round-by-round improvement curve (1A doc demo plan)"
      S: "Track 1 requires Luminal; judge Joe Fioti's compiler is search-based optimization (track1_problems.md)"

  - id: dispatchiq_t2
    name: DispatchIQ (sold to HVAC shops)
    track: T2
    pitch: "Dispatch and re-plan app sold to field-service businesses."
    p_success: 0.15
    gates: [G2, G3, G4]
    scores: {E: 6, V: 5, F: 8, W: 6, M: 7, P: 6, U: 2, S: 5, N: 4}
    evidence:
      F: "Same scheduling engine; simulated data only"

  - id: patchpilot
    name: PatchPilot (sample repo)
    track: SP
    pitch: "Detects a breaking API change, patches the controlled sample repo, runs tests."
    p_success: 0.75
    gates: [G2, G3, G4]
    scores: {E: 5, V: 4, F: 8, W: 7, M: 8, P: 8, U: 3, S: 5, N: 5}
    evidence:
      F: "DriftFix runbook (BUILD_PLAN_DriftFix.md)"
      M: "RFS author: over 30% of AWS service downtime came from unnoticed external API/package changes (YC RFS, via research notes)"
      P: "YC RFS 'Self-Maintaining APIs' explicitly asks for this company"

  - id: auditflow
    name: AuditFlow
    track: T2
    pitch: "Upload transactions and policies; AI flags possible violations with evidence and an audit report."
    p_success: 0.2
    gates: [G2, G3, G4]
    scores: {E: 5, V: 4, F: 7, W: 5, M: 7, P: 6, U: 3, S: 5, N: 4}

  - id: agentroom
    name: AgentRoom
    track: SP
    pitch: "Two developers share one AI session: one starts a task, the other reviews proposed actions."
    p_success: 0.45
    gates: [G1, G2, G3, G4]
    scores: {E: 4, V: 5, F: 5, W: 7, M: 6, P: 5, U: 7, S: 5, N: 3}

  # ---------- New ideas from v4 research ----------
  - id: countersign
    name: Countersign
    track: T2
    pitch: "An AGI Inc agent does a money errand for an elderly parent (cancel a charge, dispute a bill), then pauses so family co-sign on their phones (passkey) before the final click."
    p_success: 0.4
    gates: [G1, G2, G3, G4]
