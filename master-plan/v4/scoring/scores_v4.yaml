  - id: kernelforge
    name: KernelForge (CPU kernel speedups)
    track: T1
    pitch: "Luminal agents evolve faster CPU kernels for KernelBench-style op chains; scored on fresh random shapes."
    p_success: 0.5
    gates: [G1, G2, G3, G4]
    scores: {E: 9, V: 8, F: 6, W: 7, M: 8, P: 8, U: 2, S: 9, N: 6}
    evidence:
      E: "Track 1 metric; kernel optimization is a hard, recognized problem (KernelBench: frontier models beat PyTorch in under 20% of cases)"
      V: "KernelBench problem definitions, fresh random held-out shapes, out-of-process timing (track1_problems.md)"
      M: "Inference market ~$106B (2025) to ~$255B (2030); AlphaEvolve's 23% faster kernel cut Gemini training time ~1% (track1_problems.md)"
      P: "Codeflash and Weco are funded in code optimization; inference cost is a top spend"
