    p_success: 0.45
    gates: [G1, G2, G3, G4]
    scores: {E: 9, V: 8, F: 6, W: 8, M: 9, P: 7, U: 9, S: 6, N: 5}
    evidence:
      E: "Track 2 sales; students are the buyers in the room"
