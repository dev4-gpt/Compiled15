     pitch: "Parallel Luminal agent team that learns to migrate real public code across real breaking API changes (e.g. openai-python v0->v1); fix rate rises over rounds and is measured on held-out real repos; ends in real PRs on forks",
     proof: "Held-out pass rate (pyright + mocked-transport tests) round 0 vs round N; 2-3 PRs on forks of real repos; 1 upstream PR to an active repo if appropriate",
     scores: {E: 10, V: 8, F: 7, R: 10, U: 5, D: 8, N: 7, L: 9, S: 9, P: 8}, gates: [G1, G2, G3, G4]}
  - {id: fixmyrepo, name: FixMyRepo, track: "5", event_track: [T2, MONGO], p_success: 0.50,
     pitch: "Pay $5, get a verified PR that moves your repo off deprecated SDK calls; sold to attendees in the room via Stripe link; Claude Code GitHub Action / MCP server under the hood",
     proof: "Stripe payments plus PRs opened on buyers' real repos",
