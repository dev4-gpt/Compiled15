# Compiled15 scoring v2: evidence-grounded re-score for c0mpiled-15 (Oct 11 2026).
#
# Same top-level shape as master-plan/scoring/scores.yaml (criteria, gates, tracks,
# candidates with id/name/track/pitch/scores/p_success/gates), so score.py can be
# pointed at this file. Two changes are needed in score.py to reproduce the v2 numbers:
#   1. risk_adjusted(w, p) must use the formula below: w * (floor + slope * p),
#      with floor = 0.4 and slope = 0.6 (v1 used 0.5 + 0.5 * p).
#   2. Legacy (v1 track-winner) candidates are kept for comparison. Several fail the
#      new gates; score.py drops gate failures, so to see their numbers either
#      comment out the gate check or read the report table.
#
# Scale: 1-10 per criterion. Anchors for 2 / 5 / 8 / 10 are listed per criterion.
# p_success: probability that the LIVE PROOF lands by 7:00 PM judging
#   (held-out improvement shown on fresh cases for Track 1 entries; at least one
#   real paid sale for Track 2 entries; at least ~10 real external users or real
#   PRs/citations for the rest). It is not "probability the code runs".
# All scores are analyst judgments made from desk research on Oct 11 2026.
# Event rules come from search-engine extracts of luma.com/compiled-jjvw and must be
# verified at check-in; if a track does not exist as described, re-score E and S.

version: 2
formula:
  weighted: "sum(weight * score) / sum(weights)   # 0-10"
  final: "weighted * (floor + slope * p_success)"
  floor: 0.4
  slope: 0.6
  rationale: >
    In a sales-judged or held-out-judged track, a proof that does not land scores
    near zero on E and V (38% of weight) and loses most of D, so the penalty for
    failure is raised from 50% (v1) to 60%.

event_tracks:
  T1: {name: "Self-improving parallel agent team on Luminal (DeepSeek / GLM Flash)",
       judged_on: "relative improvement over rounds and problem difficulty; evaluated on fresh held-out tests",
       prizes: "$3,000 + Luminal founder session / $1,500 / $500", confidence: MEDIUM}
  T2: {name: "Engineering Entrepreneurship",
       judged_on: "actual sales made during the event",
       prizes: "AWS pool up to $5,000 plus Engineering Entrepreneurship and Bloomerang pools", confidence: MEDIUM}
  MONGO: {name: "Best use of MongoDB", prizes: "$1,000 credits, swag, article", confidence: MEDIUM}
  LUMINAL: {name: "Luminal inference credits", prizes: "$1,000 credits", confidence: MEDIUM}

criteria:
  E: {name: Event-track scorability, weight: 20,
      anchors: {2: "No confirmed track judges what this produces", 5: "Fits a track loosely; the track metric is not the demo's headline", 8: "Produces exactly the track metric (held-out delta or a sale)", 10: "Produces the track metric on a hard, real problem with a clean baseline"}}
  V: {name: Verifiable real-world proof, weight: 18,
      anchors: {2: "Self-authored fixtures or mocked data", 4: "Replay of real public data, no outside party involved", 6: "Real third-party artifacts (real repos, live sites, public filings) checkable by a judge", 8: "Real external users act during the event (10+), or real PRs on real repos", 10: "Paid sales or a merged upstream PR or strangers' usage logged live"}}
  F: {name: Feasibility in ~7 build hours on the free stack, weight: 14,
      anchors: {2: "Needs approvals, partners or paid APIs we lack", 5: "Core works, proof is rough", 8: "End to end with fallbacks by 5 PM", 10: "Comfortably done by 4 PM"}}
  R: {name: RFS literal fit, weight: 10,
      anchors: {2: "Tangential", 5: "Adjacent", 8: "Clearly answers it", 10: "Uses the RFS text's own nouns and verbs as the demo"}}
  U: {name: Users reachable in the room, weight: 10,
      anchors: {2: "Users are not present", 5: "A few attendees fit", 8: "Most attendees or judges can use it in 30 seconds", 10: "Everyone in the room is a user and can act live"}}
  D: {name: Demo clarity and wow, weight: 8,
      anchors: {2: "Needs explanation", 5: "Understandable dashboard", 8: "Before/after a judge sees in 30 seconds", 10: "Judge participates and sees the result change"}}
  N: {name: Novelty vs named incumbents, weight: 6,
      anchors: {2: "Shipped by a big incumbent", 5: "Partly covered by funded startups", 8: "Clear wedge incumbents ignore", 10: "New category"}}
  L: {name: Free-stack leverage (what is cheap today), weight: 5,
      anchors: {2: "Fights the free tiers", 5: "Uses free tiers", 8: "Built around a capability that just became cheap", 10: "The cheapness is the product insight"}}
  S: {name: Prize stacking, weight: 5,
      anchors: {2: "One prize at most", 5: "Track + one sponsor", 8: "Track + both sponsors", 10: "Two tracks + sponsors"}}
  P: {name: Post-event startup potential, weight: 4,
      anchors: {2: "Hobby", 5: "Small business", 8: "Venture-scale with known GTM", 10: "Team could raise on it"}}

gates:
  G1: "Proof uses real inputs the team did not author (real repos, live sites, public datasets, real users, real payments)"
  G2: "No regulated claim and consent-safe (no unannounced recording of third parties, no legal/medical advice claim)"
  G3: "Free stack and laptops only; no same-day third-party approval (e.g. WhatsApp Business verification)"
  G4: "Lands in at least one confirmed event track or sponsor prize"

tracks:
  "1": Multiplayer AI
  "2": AI-powered consumer products for 1B people
  "3": AI for the aging population
  "4": AI-native compliance infrastructure
  "5": Self-maintaining APIs
  "6": Proving you're human

